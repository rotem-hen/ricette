<ng-template #errorToast>
  {{ errorMessage }}
</ng-template>

<ng-template #recipeImageModal let-modal>
  @if (loading) {
  <div class="mask"><i class="fas fa-spin fa-circle-notch"></i></div>
  }
  <div class="modal-header">
    <h4 class="modal-title label-normal">תמונה למתכון</h4>
    <button
      type="button"
      class="close"
      style="margin: 0; padding: 0"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="image-container">
      @if (!isEditing && existingImgDownloadUrl) {
        <div class="image-preview">
          <img [src]="existingImgDownloadUrl" alt="Recipe image" style="max-width: 100%; height: auto;" />
          <button type="button" class="btn btn-outline-primary mt-3 label-normal" (click)="startEditing()">
            שינוי תמונה
          </button>
        </div>
      } @else {
        <app-image-cropper [imgSrc]="isEditing ? existingImgDownloadUrl : null" (imageCropped)="onSelect($event)" (imageReset)="reset()">
        </app-image-cropper>
      }
    </div>
  </div>
  <div class="modal-footer">
    @if (existingImgDownloadUrl) {
    <button type="button" class="btn btn-danger label-normal" (click)="onDeleteImage(modal, errorToast)">
      <i class="far fa-trash-alt label-small"></i>
    </button>
    }
    <div class="action-buttons">
      <button type="button" class="btn btn-light label-normal" (click)="modal.close('Close click')">סגירה</button>
      <button
        type="button"
        class="btn btn-success label-normal"
        [disabled]="!imageStr"
        (click)="onOK(modal, errorToast)"
        ngbAutofocus
      >
        אישור
      </button>
    </div>
  </div>
</ng-template>
